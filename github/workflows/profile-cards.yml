name: generate profile cards

on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=rudrak2005&show_icons=true&hide_border=true&theme=dark&bg_color=1B1410&title_color=C9B29B&icon_color=C9B29B&text_color=F5EFE8&include_all_commits=true&count_private=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=rudrak2005&layout=compact&hide_border=true&theme=dark&bg_color=1B1410&title_color=C9B29B&text_color=F5EFE8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: rudrak2005
          options: theme=react-dark&bg_color=1B1410&color=C9B29B&line=C9B29B&point=F5EFE8&area=true&hide_border=true
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
